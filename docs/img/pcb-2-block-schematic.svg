<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 920" width="1270" height="920" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <style>
    .bg   { fill:#ffffff; }
    .t    { font-size:21px; font-weight:700; fill:#0f172a; }
    .st   { font-size:12px; fill:#475569; }
    .bd   { font-size:10.5px; fill:#475569; }
    .net  { font-size:10px; fill:#0f766e; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ref  { font-size:10.5px; font-weight:700; fill:#0f172a; }
    .warn { font-size:10.5px; fill:#b91c1c; }
    .board{ fill:#fbfdfe; stroke:#0f766e; stroke-width:1.6; stroke-dasharray:8 5; }
    .ob   { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.3; stroke-dasharray:5 4; }
    .pwr  { fill:#fee2e2; stroke:#dc2626; stroke-width:1.4; }
    .ctl  { fill:#dcfce7; stroke:#16a34a; stroke-width:1.4; }
    .conn { fill:#ecfdf5; stroke:#16a34a; stroke-width:1.4; }
    .sns  { fill:#dbeafe; stroke:#2563eb; stroke-width:1.4; }
    .note { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.2; }
    .w    { stroke:#b91c1c; stroke-width:2.2; fill:none; }
    .wd   { stroke:#0f766e; stroke-width:1.4; fill:none; stroke-dasharray:6 4; }
    .wc   { stroke:#334155; stroke-width:1.5; fill:none; }
    .ch   { stroke:#cbd5e1; stroke-width:1.2; fill:none; }
    .sym  { stroke:#334155; stroke-width:1.5; fill:none; }
    .flag { fill:#ccfbf1; stroke:#0f766e; stroke-width:1.2; }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#b91c1c"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#0f766e"/>
    </marker>
    <marker id="ark" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1270" height="920"/>

  <text class="t" x="24" y="34">Vezha · PCB 2 — power board</text>
  <text class="st" x="24" y="56">Block overview of docs/11-pcb-2-schematic.md — same reference designators, net names and values. That document is the authority; this is the one-page view of it. Nothing here is built or measured.</text>

  <!-- board outline -->
  <rect class="board" x="226" y="84" width="804" height="746" rx="10"/>
  <text class="ref" x="242" y="106">PCB 2 · board outline (dashed teal) — a carrier plus a sequencing controller; the modules do the PD and the regulation</text>

  <!-- off-board input -->
  <rect class="ob" x="22" y="130" width="192" height="86" rx="6"/>
  <text class="ref" x="34" y="150">External USB-C PD</text>
  <text class="bd" x="34" y="166">charger or power bank</text>
  <text class="bd" x="34" y="180">into the RotoPD's own</text>
  <text class="bd" x="34" y="194">jack at the enclosure wall</text>
  <text class="bd" x="34" y="208">bank vs. internal cell: open</text>

  <!-- off-board Orange Pi -->
  <rect class="ob" x="1060" y="130" width="192" height="118" rx="6"/>
  <text class="ref" x="1072" y="150">Orange Pi 5 Plus</text>
  <text class="bd" x="1072" y="166">Enclosure A</text>
  <text class="bd" x="1072" y="180">dedicated USB-C power in</text>
  <text class="bd" x="1072" y="194">specified 5 V @ 4 A</text>
  <text class="warn" x="1072" y="212">must still see ≥ 4.75 V</text>
  <text class="warn" x="1072" y="226">here under load — the loop</text>
  <text class="warn" x="1072" y="240">binds before the 3 A limit</text>

  <!-- U1 RotoPD -->
  <rect class="pwr" x="250" y="118" width="200" height="118" rx="6"/>
  <text class="ref" x="262" y="138">U1 · CentyLab RotoPD Pro</text>
  <text class="bd" x="262" y="154">module · AP33772S + 100 V switch</text>
  <text class="bd" x="262" y="168">PD over its own USB-C jack</text>
  <text class="bd" x="262" y="182">aux buck 5 V, 0.4 A continuous</text>
  <text class="bd" x="262" y="196">own INA238 · I²C1 with the Pico</text>
  <text class="warn" x="262" y="212">240 W EPR/AVS — VBUS to 48 V</text>
  <text class="warn" x="262" y="226">addresses are community-sourced</text>

  <!-- U3 Pololu -->
  <rect class="pwr" x="530" y="118" width="200" height="118" rx="6"/>
  <text class="ref" x="542" y="138">U3 · Pololu D42V55F5</text>
  <text class="bd" x="542" y="154">module · fixed 5.0 V ±3 %, 6 A typ</text>
  <text class="bd" x="542" y="168">VBUS_PD → +5V_RTR for the Pi</text>
  <text class="bd" x="542" y="182">EN in · PG open-drain, R2 10 kΩ</text>
  <text class="warn" x="542" y="198">PART NUMBER OPEN: the 4.85 V</text>
  <text class="warn" x="542" y="212">corner misses the seam's loop</text>
  <text class="warn" x="542" y="226">budget — F5.3 (#5572) at 5.3 V?</text>

  <!-- J2 seam -->
  <rect class="conn" x="830" y="118" width="190" height="118" rx="6"/>
  <text class="ref" x="842" y="138">J2 · seam USB-C out</text>
  <text class="bd" x="842" y="154">5 V and GND only</text>
  <text class="bd" x="842" y="168">no signal, no detect pin</text>
  <text class="bd" x="842" y="182">Rp on CC1 and CC2</text>
  <text class="bd" x="842" y="196">VBUS after a sink's Rd</text>
  <text class="warn" x="842" y="212">25 mΩ round-trip loop at 4 A</text>
  <text class="warn" x="842" y="226">is the real constraint</text>

  <!-- power path wires -->
  <path class="w" d="M214 177 H246" marker-end="url(#ar)"/>
  <path class="w" d="M450 177 H526" marker-end="url(#ar)"/>
  <text class="net" x="489" y="158" text-anchor="middle">4.5–48 V</text>
  <path class="wd" d="M489 177 V204"/>
  <rect class="flag" x="454" y="204" width="70" height="18" rx="3"/>
  <text class="net" x="489" y="217" text-anchor="middle">VBUS_PD</text>

  <path class="w" d="M730 177 H748"/>
  <rect x="750" y="170" width="32" height="14" fill="#ffffff" stroke="#b91c1c" stroke-width="1.6"/>
  <text class="net" x="766" y="160" text-anchor="middle">R13 · 2 mΩ</text>
  <path class="w" d="M784 177 H826" marker-end="url(#ar)"/>
  <path class="w" d="M1020 177 H1056" marker-end="url(#ar)"/>
  <text class="net" x="892" y="252" text-anchor="middle">+5V_RTR</text>

  <!-- shunt sense taps -->
  <path class="wc" d="M750 184 V250"/>
  <path class="wc" d="M782 184 V250"/>

  <!-- U6 INA226 -->
  <rect class="sns" x="700" y="266" width="190" height="110" rx="6"/>
  <text class="ref" x="712" y="286">U6 · INA226AIDGSR</text>
  <text class="bd" x="712" y="302">LCSC C49851 · VSSOP-10</text>
  <text class="bd" x="712" y="316">high-side across R13 (C160590)</text>
  <text class="bd" x="712" y="330">1.25 mA steps · what the Pi gets</text>
  <text class="bd" x="712" y="344">I²C1 · strap clear of 0x40, 0x52</text>
  <text class="warn" x="712" y="362">basis for overcurrent shutdown</text>
  <path class="wd" d="M795 376 V388"/>
  <rect class="flag" x="760" y="388" width="70" height="18" rx="3"/>
  <text class="net" x="795" y="401" text-anchor="middle">I2C1</text>

  <!-- RT1 NTC -->
  <rect class="sns" x="700" y="422" width="190" height="76" rx="6"/>
  <text class="ref" x="712" y="442">RT1 · 10 kΩ NTC on U3's pad</text>
  <text class="bd" x="712" y="458">Murata NCP18XH103F03RB</text>
  <text class="bd" x="712" y="472">C13564 · R16 10 kΩ divider</text>
  <text class="bd" x="712" y="486">derating with the lid closed</text>
  <path class="wc" d="M700 460 H688"/>
  <rect class="flag" x="612" y="451" width="74" height="18" rx="3"/>
  <text class="net" x="649" y="464" text-anchor="middle">NTC_ADC</text>

  <!-- U2 Pico -->
  <rect class="ctl" x="250" y="300" width="220" height="130" rx="6"/>
  <text class="ref" x="262" y="320">U2 · Raspberry Pi Pico 2</text>
  <text class="bd" x="262" y="336">RP2350, non-wireless</text>
  <text class="bd" x="262" y="350">VSYS from +5V_AUX through D1</text>
  <text class="bd" x="262" y="364">+3V3 out: ≤ 300 mA for the board</text>
  <text class="bd" x="262" y="378">GP2/3 I²C1 · GP4/5 I²C0</text>
  <text class="bd" x="262" y="392">GP6 EN · GP7 PG · GP26/27 CC ADC</text>
  <text class="bd" x="262" y="406">boots before the Orange Pi</text>
  <text class="warn" x="262" y="423">GP6 is push-pull, never an input</text>

  <!-- aux 5 V through D1 -->
  <path class="w" d="M300 236 V252"/>
  <path class="sym" d="M292 252 H308 M300 252 L292 266 L308 266 Z M292 266 H308" fill="#ffffff"/>
  <path class="w" d="M300 266 V298" marker-end="url(#ar)"/>
  <text class="net" x="316" y="250">+5V_AUX ≤ 0.4 A</text>
  <text class="net" x="316" y="264">D1 · SS14 blocks</text>
  <text class="net" x="316" y="278">back-feed → VSYS</text>
  <text class="net" x="316" y="292">4.58–4.75 V</text>

  <!-- I2C bus 1 -->
  <path class="wd" d="M420 298 V236"/>
  <circle cx="420" cy="298" r="2.6" fill="#0f766e"/>
  <circle cx="420" cy="236" r="2.6" fill="#0f766e"/>
  <text class="net" x="430" y="252">I²C1 · GP2/3</text>
  <text class="net" x="430" y="266">rail-critical</text>

  <!-- PG -->
  <path class="wc" d="M570 236 V286 H460 V298" marker-end="url(#ark)"/>
  <text class="net" x="478" y="280">PG → GP7</text>

  <!-- NTC net label at the Pico -->
  <path class="wc" d="M470 314 H486"/>
  <rect class="flag" x="486" y="305" width="74" height="18" rx="3"/>
  <text class="net" x="523" y="318" text-anchor="middle">NTC_ADC</text>

  <!-- EN + pull-down -->
  <path class="wc" d="M470 340 H640 V236" marker-end="url(#ark)"/>
  <text class="net" x="478" y="332">EN ← GP6</text>
  <circle cx="610" cy="340" r="2.6" fill="#334155"/>
  <path class="wc" d="M610 340 V372"/>
  <rect x="603" y="372" width="14" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <path class="sym" d="M610 406 V418 M602 418 H618 M605 423 H615 M608 428 H612"/>
  <text class="net" x="628" y="388">R1 · 1.5 kΩ</text>
  <text class="net" x="628" y="402">imposes OFF</text>

  <!-- I2C0 to the OLED -->
  <path class="wd" d="M470 410 H512 V540 H528" marker-end="url(#arg)"/>
  <text class="net" x="478" y="404">I²C0 · GP4/5</text>

  <!-- J4 OLED -->
  <rect class="conn" x="530" y="500" width="190" height="96" rx="6"/>
  <text class="ref" x="542" y="520">J4 · OLED console</text>
  <text class="bd" x="542" y="536">Adafruit 5297</text>
  <text class="bd" x="542" y="550">JST-SH QT 4-pin</text>
  <text class="bd" x="542" y="564">+3V3 · GND · SDA · SCL</text>
  <text class="bd" x="542" y="578">I²C0 — reporting only</text>

  <!-- J5 encoder -->
  <rect class="conn" x="760" y="500" width="190" height="96" rx="6"/>
  <text class="ref" x="772" y="520">J5 · push encoder</text>
  <text class="bd" x="772" y="536">Alps EC11E15244B2, keyed</text>
  <text class="bd" x="772" y="550">R7–R9 10 kΩ · R10–R12 1 kΩ</text>
  <text class="bd" x="772" y="564">C1–C3 100 nF · A · B · SW</text>
  <text class="bd" x="772" y="578">RC on board and Gray decode</text>
  <text class="warn" x="772" y="592">100 nF exactly — see SIM-05</text>
  <path class="wc" d="M450 430 V620 H855 V598" marker-end="url(#ark)"/>
  <text class="net" x="470" y="614">GP12 · A · B · SW — the RC is a window, not a floor</text>

  <!-- J3 telemetry -->
  <rect class="conn" x="250" y="460" width="180" height="120" rx="6"/>
  <text class="ref" x="262" y="480">J3 · telemetry UART</text>
  <text class="bd" x="262" y="496">1×3 header · C2937625</text>
  <text class="warn" x="262" y="512">POPULATED, unwired</text>
  <text class="bd" x="262" y="528">4-position, one blanked</text>
  <text class="bd" x="262" y="542">as a key</text>
  <text class="bd" x="262" y="556">R14/R15 220 Ω series</text>
  <text class="bd" x="262" y="570">silkscreen TX→RX</text>
  <path class="wd" d="M330 430 V458"/>

  <!-- service note -->
  <rect class="note" x="250" y="640" width="780" height="56" rx="6"/>
  <text class="bd" x="264" y="662">Also on the board, not drawn here: J1 RotoPD I²C (JST-SH, or U1's 1×8 header — not both) · J7 SWD 1×3 and a RUN reset pad · JP1 0 Ω to U1 pin 6, DNP in Rev A ·</text>
  <text class="bd" x="264" y="680">test points on VBUS_PD, +5V_RTR, +3V3 and GND, plus a pair at the seam · 0 Ω jumpers on EN and each I²C bus · fiducials. U4's and U5's own passives come from the TI datasheets.</text>

  <!-- accessory branch -->
  <rect class="flag" x="230" y="745" width="70" height="18" rx="3"/>
  <text class="net" x="265" y="758" text-anchor="middle">VBUS_PD</text>
  <path class="w" d="M300 754 H346" marker-end="url(#ar)"/>

  <rect class="pwr" x="350" y="710" width="190" height="90" rx="6"/>
  <text class="ref" x="362" y="730">U4 · TI LMR38020FDDAR</text>
  <text class="bd" x="362" y="746">LCSC C5149193</text>
  <text class="warn" x="362" y="762">4.2–80 V in, because VBUS</text>
  <text class="warn" x="362" y="776">reaches 48 V</text>
  <text class="bd" x="362" y="792">→ +5V_ACC · EN from GP10</text>

  <rect class="pwr" x="570" y="710" width="170" height="90" rx="6"/>
  <text class="ref" x="582" y="730">U5 · TI TPS2553DBVR</text>
  <text class="bd" x="582" y="746">LCSC C55266 · SOT-23-6</text>
  <text class="bd" x="582" y="762">R5 22.6 kΩ sets the limit</text>
  <text class="bd" x="582" y="776">to 1.06–1.23 A</text>
  <text class="bd" x="582" y="792">EN GP8 · FAULT GP9</text>
  <path class="w" d="M540 755 H566" marker-end="url(#ar)"/>

  <rect class="conn" x="770" y="710" width="250" height="90" rx="6"/>
  <text class="ref" x="782" y="730">J6 · accessory USB-C out</text>
  <text class="bd" x="782" y="746">HRO TYPE-C-31-M-12 · C165948</text>
  <text class="bd" x="782" y="762">side-facing, 5 V power only</text>
  <text class="bd" x="782" y="776">R3/R4 36 kΩ Rp to +3V3, not 5 V</text>
  <text class="bd" x="782" y="792">CC1/CC2 sensed on GP26/27</text>
  <path class="w" d="M740 755 H766" marker-end="url(#ar)"/>

  <!-- footer -->
  <line class="ch" x1="24" y1="852" x2="1246" y2="852"/>
  <text class="bd" x="24" y="872">Thick red = power · dashed teal = I²C · thin grey = control and sense lines · dashed grey = off-board. Teal flags are net labels: same name, same net, no wire drawn.</text>
  <text class="warn" x="24" y="890">CAUTION · The bare buck defaults ON — the module pulls EN up to VIN through 1 MΩ, so OFF must be imposed. 100 k, 47 k and 22 k all leave it enabled at 48 V in; R1 is 1.5 kΩ.</text>
  <text class="warn" x="24" y="908">CAUTION · J6 must never see raw VBUS_PD, which reaches 48 V on a 240 W EPR contract. +5V_AUX is 0.4 A total; +3V3 off the Pico is 300 mA for the whole board.</text>
</svg>
