<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 920" width="1270" height="920" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <style>
    .bg   { fill:#ffffff; }
    .t    { font-size:21px; font-weight:700; fill:#0f172a; }
    .st   { font-size:12px; fill:#475569; }
    .bd   { font-size:10.5px; fill:#475569; }
    .net  { font-size:10px; fill:#0f766e; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ref  { font-size:10.5px; font-weight:700; fill:#0f172a; }
    .warn { font-size:10.5px; fill:#b91c1c; }
    .board{ fill:#fbfdfe; stroke:#0f766e; stroke-width:1.6; stroke-dasharray:8 5; }
    .ob   { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.3; stroke-dasharray:5 4; }
    .pwr  { fill:#fee2e2; stroke:#dc2626; stroke-width:1.4; }
    .ctl  { fill:#dcfce7; stroke:#16a34a; stroke-width:1.4; }
    .conn { fill:#ecfdf5; stroke:#16a34a; stroke-width:1.4; }
    .ic   { fill:#dbeafe; stroke:#2563eb; stroke-width:1.4; }
    .note { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.2; }
    .w    { stroke:#b91c1c; stroke-width:2.2; fill:none; }
    .wd   { stroke:#0f766e; stroke-width:1.4; fill:none; stroke-dasharray:6 4; }
    .wc   { stroke:#334155; stroke-width:1.5; fill:none; }
    .ch   { stroke:#cbd5e1; stroke-width:1.2; fill:none; }
    .sym  { stroke:#334155; stroke-width:1.5; fill:none; }
    .flag { fill:#ccfbf1; stroke:#0f766e; stroke-width:1.2; }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#b91c1c"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#0f766e"/>
    </marker>
    <marker id="ark" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1270" height="920"/>

  <text class="t" x="24" y="34">Vezha · PCB 2 — power board</text>
  <text class="st" x="24" y="56">Block schematic, Rev A candidate — from docs/05-pcb-2-power.md and the ngspice decks in sim/. A carrier plus a sequencing controller: it mounts the modules that do PD and regulation, it does not implement them.</text>

  <!-- board outline -->
  <rect class="board" x="226" y="84" width="804" height="746" rx="10"/>
  <text class="ref" x="242" y="106">PCB 2 · board outline (dashed teal) — module envelopes UNMEASURED; the RotoPD Pro outline still blocks Enclosure B</text>

  <!-- off-board input -->
  <rect class="ob" x="22" y="130" width="192" height="86" rx="6"/>
  <text class="ref" x="34" y="150">External USB-C PD</text>
  <text class="bd" x="34" y="166">charger or power bank</text>
  <text class="bd" x="34" y="180">plugs into the RotoPD's</text>
  <text class="bd" x="34" y="194">own jack at the wall</text>
  <text class="bd" x="34" y="208">bank vs. internal cell: open</text>

  <!-- off-board Orange Pi -->
  <rect class="ob" x="1060" y="130" width="192" height="118" rx="6"/>
  <text class="ref" x="1072" y="150">Orange Pi 5 Plus</text>
  <text class="bd" x="1072" y="166">Enclosure A</text>
  <text class="bd" x="1072" y="180">dedicated USB-C power in</text>
  <text class="bd" x="1072" y="194">specified 5 V @ 4 A</text>
  <text class="warn" x="1072" y="212">must still see ≥ 4.75 V</text>
  <text class="warn" x="1072" y="226">here, under load — that</text>
  <text class="warn" x="1072" y="240">is what binds, not 3 A</text>

  <!-- U1 RotoPD -->
  <rect class="pwr" x="250" y="118" width="200" height="118" rx="6"/>
  <text class="ref" x="262" y="138">U1 · CentyLab RotoPD Pro</text>
  <text class="bd" x="262" y="154">module, not a part on this PCB</text>
  <text class="bd" x="262" y="168">PD over its own USB-C jack</text>
  <text class="bd" x="262" y="182">switched VBUS · aux 5 V 0.4 A</text>
  <text class="bd" x="262" y="196">I²C bus 1 control</text>
  <text class="warn" x="262" y="212">240 W EPR/AVS — VBUS to 48 V</text>
  <text class="warn" x="262" y="226">outline + height unmeasured</text>

  <!-- U2 Pololu -->
  <rect class="pwr" x="530" y="118" width="200" height="118" rx="6"/>
  <text class="ref" x="542" y="138">U2 · Pololu D42V55F5</text>
  <text class="bd" x="542" y="154">#5571 · fixed 5.0 V ±3 %</text>
  <text class="bd" x="542" y="168">VBUS → 5 V for the Orange Pi</text>
  <text class="bd" x="542" y="182">EN input · PG output</text>
  <text class="warn" x="542" y="198">PART NUMBER REOPENED: the</text>
  <text class="warn" x="542" y="212">4.85 V corner misses the seam's</text>
  <text class="warn" x="542" y="226">loop budget — #5572 (5.3 V)?</text>

  <!-- J1 seam -->
  <rect class="conn" x="830" y="118" width="190" height="118" rx="6"/>
  <text class="ref" x="842" y="138">J1 · seam USB-C out</text>
  <text class="bd" x="842" y="154">5 V and GND only</text>
  <text class="bd" x="842" y="168">no signal, no detect pin</text>
  <text class="bd" x="842" y="182">Rp on CC1 and CC2</text>
  <text class="bd" x="842" y="196">VBUS after a sink's Rd</text>
  <text class="warn" x="842" y="212">25 mΩ round-trip loop at</text>
  <text class="warn" x="842" y="226">4 A binds before 3 A does</text>

  <!-- power path wires -->
  <path class="w" d="M214 177 H246" marker-end="url(#ar)"/>
  <path class="w" d="M450 177 H526" marker-end="url(#ar)"/>
  <text class="net" x="489" y="158" text-anchor="middle">up to 48 V</text>
  <path class="wd" d="M489 177 V204"/>
  <rect class="flag" x="454" y="204" width="70" height="18" rx="3"/>
  <text class="net" x="489" y="217" text-anchor="middle">PD_VBUS</text>

  <path class="w" d="M730 177 H748"/>
  <rect x="750" y="170" width="32" height="14" fill="#ffffff" stroke="#b91c1c" stroke-width="1.6"/>
  <text class="net" x="766" y="160" text-anchor="middle">RS · 2 mΩ</text>
  <path class="w" d="M784 177 H826" marker-end="url(#ar)"/>
  <path class="w" d="M1020 177 H1056" marker-end="url(#ar)"/>

  <!-- shunt sense taps -->
  <path class="wc" d="M750 184 V250"/>
  <path class="wc" d="M782 184 V250"/>

  <!-- U6 INA226 -->
  <rect class="ic" x="700" y="250" width="190" height="110" rx="6"/>
  <text class="ref" x="712" y="270">U6 · INA226 monitor</text>
  <text class="bd" x="712" y="286">high-side on the 5 V output</text>
  <text class="bd" x="712" y="300">2 mΩ shunt · 1.25 mA steps</text>
  <text class="bd" x="712" y="314">measures what the Pi receives</text>
  <text class="bd" x="712" y="328">I²C bus 1 · defaults to 0x40</text>
  <text class="warn" x="712" y="346">verify vs the RotoPD address</text>
  <path class="wd" d="M795 360 V372"/>
  <rect class="flag" x="760" y="372" width="70" height="18" rx="3"/>
  <text class="net" x="795" y="385" text-anchor="middle">I2C_BUS1</text>

  <!-- RT1 NTC -->
  <rect class="ic" x="700" y="410" width="190" height="76" rx="6"/>
  <text class="ref" x="712" y="430">RT1 · NTC on U2's pad</text>
  <text class="bd" x="712" y="446">→ Pico ADC</text>
  <text class="bd" x="712" y="460">derating with the lid closed</text>
  <text class="bd" x="712" y="474">fold back before it fails</text>
  <path class="wc" d="M700 448 H688"/>
  <rect class="flag" x="606" y="439" width="80" height="18" rx="3"/>
  <text class="net" x="646" y="452" text-anchor="middle">NTC_ADC</text>

  <!-- U3 Pico -->
  <rect class="ctl" x="250" y="300" width="220" height="130" rx="6"/>
  <text class="ref" x="262" y="320">U3 · Raspberry Pi Pico 2</text>
  <text class="bd" x="262" y="336">non-wireless, the controller</text>
  <text class="bd" x="262" y="350">aux 5 V → VSYS, never U2's rail</text>
  <text class="bd" x="262" y="364">USB + SWD brought to the wall</text>
  <text class="bd" x="262" y="378">boots before the Orange Pi</text>
  <text class="bd" x="262" y="392">bus 1: RotoPD + INA226</text>
  <text class="bd" x="262" y="406">ADC: NTC · bus 2: OLED</text>
  <text class="warn" x="262" y="423">validates the PD contract first</text>

  <!-- aux 5 V -->
  <path class="w" d="M300 236 V298" marker-end="url(#ar)"/>
  <text class="net" x="310" y="256">aux 5 V</text>
  <text class="net" x="310" y="270">≤ 0.4 A</text>
  <text class="net" x="310" y="284">→ VSYS</text>

  <!-- I2C bus 1 -->
  <path class="wd" d="M420 298 V236"/>
  <circle cx="420" cy="298" r="2.6" fill="#0f766e"/>
  <circle cx="420" cy="236" r="2.6" fill="#0f766e"/>
  <text class="net" x="430" y="252">I²C bus 1</text>
  <text class="net" x="430" y="266">PD + INA226</text>

  <!-- PG -->
  <path class="wc" d="M570 236 V286 H460 V298" marker-end="url(#ark)"/>
  <text class="net" x="478" y="280">PG · rail OK</text>

  <!-- NTC net label at the Pico -->
  <path class="wc" d="M470 314 H486"/>
  <rect class="flag" x="486" y="305" width="80" height="18" rx="3"/>
  <text class="net" x="526" y="318" text-anchor="middle">NTC_ADC</text>

  <!-- EN + pull-down -->
  <path class="wc" d="M470 340 H640 V236" marker-end="url(#ark)"/>
  <text class="net" x="478" y="332">EN · 0 Ω jumper</text>
  <circle cx="610" cy="340" r="2.6" fill="#334155"/>
  <path class="wc" d="M610 340 V372"/>
  <rect x="603" y="372" width="14" height="34" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <path class="sym" d="M610 406 V418 M602 418 H618 M605 423 H615 M608 428 H612"/>
  <text class="net" x="628" y="388">R1 · 1.5 kΩ</text>
  <text class="net" x="628" y="402">imposes OFF</text>

  <!-- I2C bus 2 to the OLED -->
  <path class="wd" d="M470 410 H512 V540 H528" marker-end="url(#arg)"/>
  <text class="net" x="478" y="404">I²C bus 2</text>

  <!-- J2 OLED -->
  <rect class="conn" x="530" y="500" width="190" height="96" rx="6"/>
  <text class="ref" x="542" y="520">J2 · OLED console</text>
  <text class="bd" x="542" y="536">Adafruit 5297</text>
  <text class="bd" x="542" y="550">JST-SH QT 4-pin</text>
  <text class="bd" x="542" y="564">3V3 · GND · SDA · SCL</text>
  <text class="bd" x="542" y="578">bus 2 — reporting only</text>

  <!-- J3 encoder -->
  <rect class="conn" x="760" y="500" width="190" height="96" rx="6"/>
  <text class="ref" x="772" y="520">J3 · push encoder</text>
  <text class="bd" x="772" y="536">Alps EC11E15244B2</text>
  <text class="bd" x="772" y="550">keyed 4-pin: A · B · SW · GND</text>
  <text class="bd" x="772" y="564">10 kΩ pull-ups, for a defined</text>
  <text class="bd" x="772" y="578">level before pinmux</text>
  <text class="warn" x="772" y="592">firmware debounce — no RC</text>
  <path class="wc" d="M450 430 V620 H855 V598" marker-end="url(#ark)"/>
  <text class="net" x="470" y="614">GPIO · A · B · SW — do not fit debounce caps</text>

  <!-- J5 telemetry -->
  <rect class="conn" x="250" y="460" width="180" height="120" rx="6"/>
  <text class="ref" x="262" y="480">J5 · telemetry UART</text>
  <text class="bd" x="262" y="496">3-pin TX · RX · GND</text>
  <text class="warn" x="262" y="512">POPULATED, unwired</text>
  <text class="bd" x="262" y="528">4-position, one blanked</text>
  <text class="bd" x="262" y="542">as a key</text>
  <text class="bd" x="262" y="556">100–330 Ω series</text>
  <text class="bd" x="262" y="570">silkscreen TX→RX</text>
  <path class="wd" d="M330 430 V458"/>

  <!-- service note -->
  <rect class="note" x="250" y="640" width="780" height="56" rx="6"/>
  <text class="bd" x="264" y="662">Bench &amp; service, not drawn as nets: Pico SWD 3-pin (SWCLK · SWDIO · GND) and a RUN reset pad · test points on PD VBUS, VOUT, 3V3 and GND, plus a pair</text>
  <text class="bd" x="264" y="680">right at the seam output · 0 Ω jumpers on EN and each I²C bus · spare Pico GPIO broken out · fiducials and mounting holes. All of it is cents now, impossible later.</text>

  <!-- accessory branch -->
  <rect class="flag" x="230" y="745" width="70" height="18" rx="3"/>
  <text class="net" x="265" y="758" text-anchor="middle">PD_VBUS</text>
  <path class="w" d="M300 754 H346" marker-end="url(#ar)"/>

  <rect class="pwr" x="350" y="710" width="190" height="90" rx="6"/>
  <text class="ref" x="362" y="730">U4 · accessory buck</text>
  <text class="bd" x="362" y="746">part TBD</text>
  <text class="warn" x="362" y="762">must be rated for 48 V in</text>
  <text class="bd" x="362" y="778">PD VBUS → 5 V @ 1.0 A</text>
  <text class="bd" x="362" y="792">its own rail, not the router's</text>

  <rect class="pwr" x="570" y="710" width="170" height="90" rx="6"/>
  <text class="ref" x="582" y="730">U5 · load switch</text>
  <text class="bd" x="582" y="746">or eFuse, defined limit</text>
  <text class="bd" x="582" y="762">≈ 1.25 A — trips above</text>
  <text class="bd" x="582" y="778">the advertised 1.0 A,</text>
  <text class="bd" x="582" y="792">not at it</text>
  <path class="w" d="M540 755 H566" marker-end="url(#ar)"/>

  <rect class="conn" x="770" y="710" width="250" height="90" rx="6"/>
  <text class="ref" x="782" y="730">J4 · accessory USB-C out</text>
  <text class="bd" x="782" y="746">HRO TYPE-C-31-M-12 · C165948</text>
  <text class="bd" x="782" y="762">side-facing, 5 V power only</text>
  <text class="bd" x="782" y="778">Rp 56 kΩ ±20 % on CC1 and CC2</text>
  <text class="warn" x="782" y="792">VBUS only after a sink's Rd</text>
  <path class="w" d="M740 755 H766" marker-end="url(#ar)"/>

  <!-- footer -->
  <line class="ch" x1="24" y1="852" x2="1246" y2="852"/>
  <text class="bd" x="24" y="872">Thick red = power · dashed teal = I²C · thin grey = control and sense lines · dashed grey = off-board. Teal flags are net labels: same name, same net, no wire drawn.</text>
  <text class="warn" x="24" y="890">CAUTION · The bare buck defaults ON — the module pulls EN up to VIN through 1 MΩ, so OFF must be imposed. 100 k, 47 k and 22 k all leave it enabled at 48 V in; fit 1.5 kΩ.</text>
  <text class="warn" x="24" y="908">CAUTION · J4 must never see raw PD VBUS — the RotoPD is a 240 W EPR/AVS part, so VBUS reaches 48 V. Aux 5 V is 0.4 A total for U3 + J2 + J3, never the Orange Pi.</text>
</svg>
