<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 848" width="1200" height="848" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <style>
    .bg   { fill:#ffffff; }
    .t    { font-size:21px; font-weight:700; fill:#0f172a; }
    .st   { font-size:12px; fill:#475569; }
    .bl   { font-size:12.5px; font-weight:700; fill:#0f172a; }
    .bd   { font-size:10.5px; fill:#475569; }
    .net  { font-size:10px; fill:#0f766e; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .pin  { font-size:10.5px; fill:#334155; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ref  { font-size:10.5px; font-weight:700; fill:#0f172a; }
    .warn { font-size:10.5px; fill:#b91c1c; }
    .board{ fill:#fbfdfe; stroke:#0f766e; stroke-width:1.6; stroke-dasharray:8 5; }
    .ob   { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.3; stroke-dasharray:5 4; }
    .ic   { fill:#dbeafe; stroke:#2563eb; stroke-width:1.4; }
    .conn { fill:#dcfce7; stroke:#16a34a; stroke-width:1.4; }
    .led  { fill:#ffedd5; stroke:#ea580c; stroke-width:1.4; }
    .w    { stroke:#334155; stroke-width:1.5; fill:none; }
    .wd   { stroke:#0f766e; stroke-width:1.4; fill:none; stroke-dasharray:6 4; }
    .ch   { stroke:#cbd5e1; stroke-width:1.2; fill:none; }
    .sym  { stroke:#334155; stroke-width:1.5; fill:none; }
    .dot  { fill:#334155; }
    .ret  { fill:#fef3c7; stroke:#b45309; stroke-width:1.4; }
    .rett { font-size:12.5px; font-weight:700; fill:#92400e; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="848"/>

  <text class="t" x="24" y="34">Vezha · PCB 1 — front control board</text>
  <rect class="ret" x="24" y="46" width="1152" height="32" rx="5"/>
  <text class="rett" x="38" y="67">RETIRED — not built in v1. The front panel was cut on 2026-11-18 and Enclosure A is headless. Kept complete so a v2 panel inherits it.</text>
  <text class="st" x="24" y="98">Block overview of docs/retired/pcb-1-schematic.md — same reference designators, net names and values.</text>
  <text class="st" x="24" y="115">That document is the authority; this is the one-page view of it. Nothing here was ever built or measured.</text>
  <g transform="translate(0,58)">

  <!-- board outline -->
  <rect class="board" x="236" y="84" width="664" height="620" rx="10"/>
  <text class="bl" x="252" y="106">PCB 1 · board outline (dashed teal)</text>

  <!-- off-board items -->
  <rect class="ob" x="22" y="130" width="196" height="80" rx="6"/>
  <text class="ref" x="34" y="150">S1 · NKK MN12LL4G01</text>
  <text class="bd" x="34" y="166">locking AIRPLANE toggle</text>
  <text class="bd" x="34" y="180">panel-mount, flying leads</text>
  <text class="bd" x="34" y="194">off-board — not on the PCB</text>

  <rect class="ob" x="22" y="330" width="196" height="86" rx="6"/>
  <text class="ref" x="34" y="350">M1 · Adafruit #6310</text>
  <text class="bd" x="34" y="366">ANO wheel, I²C module</text>
  <text class="bd" x="34" y="380">address 0x49</text>
  <text class="bd" x="34" y="394">own standoffs + QT cable</text>
  <text class="bd" x="34" y="408">off-board</text>

  <rect class="ob" x="22" y="600" width="196" height="86" rx="6"/>
  <text class="ref" x="34" y="620">Waveshare 4.26" e-paper</text>
  <text class="bd" x="34" y="636">107 × 64 mm driver board</text>
  <text class="bd" x="34" y="650">SPI, no touch — docs/retired/</text>
  <text class="bd" x="34" y="664">own bracket · 20 cm GH1.25</text>
  <text class="bd" x="34" y="678">9-pin cable, off-board</text>

  <!-- harness channel -->
  <line class="ch" x1="920" y1="110" x2="920" y2="690"/>

  <!-- J1 harness -->
  <rect x="948" y="112" width="232" height="534" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text class="ref" x="962" y="134">J1 · 2×20 shrouded header</text>
  <text class="bd" x="962" y="149">one IDC ribbon → Orange Pi 40-pin</text>
  <text class="bd" x="962" y="163">header. ~17 signals, so a custom</text>
  <text class="bd" x="962" y="177">harness was not worth building.</text>
  <line class="ch" x1="962" y1="186" x2="1166" y2="186"/>
  <text class="pin" x="962" y="208">+5 V</text><text class="pin" x="1042" y="208">LED anodes</text>
  <text class="pin" x="962" y="230">+3V3</text><text class="pin" x="1042" y="230">logic + pull-ups</text>
  <text class="pin" x="962" y="252">GND</text><text class="pin" x="1042" y="252">several</text>
  <text class="pin" x="962" y="274">SDA</text><text class="pin" x="1042" y="274">shared I²C</text>
  <text class="pin" x="962" y="296">SCL</text><text class="pin" x="1042" y="296">shared I²C</text>
  <text class="pin" x="962" y="318">GPIO</text><text class="pin" x="1042" y="318">AIRPLANE</text>
  <text class="pin" x="962" y="340">GPIO</text><text class="pin" x="1042" y="340">LINK · MAC · ★</text>
  <text class="pin" x="962" y="362">GPIO</text><text class="pin" x="1042" y="362">SW4/SW5 spare</text>
  <text class="pin" x="962" y="384">/RESET</text><text class="pin" x="1042" y="384">U1 blanking</text>
  <text class="pin" x="962" y="406">SPI ×7</text><text class="pin" x="1042" y="406">display, out to J2</text>
  <line class="ch" x1="962" y1="422" x2="1166" y2="422"/>
  <text class="bd" x="962" y="442">PCB 1 is the single breakout</text>
  <text class="bd" x="962" y="456">point: one standard ribbon in,</text>
  <text class="bd" x="962" y="470">one GH cable out to the panel.</text>
  <text class="bd" x="962" y="492">Pin map resolved from wiringOP:</text>
  <text class="bd" x="962" y="506">I²C on 3/5, SPI0 on 19/23/24 —</text>
  <text class="bd" x="962" y="520">Pi positions. But it is I²C2,</text>
  <text class="warn" x="962" y="534">not i2c-1. A software trap.</text>
  <text class="bd" x="962" y="556">Per key and on the toggle:</text>
  <text class="bd" x="962" y="570">R5–R8 10 kΩ · R9–R12 1 kΩ ·</text>
  <text class="bd" x="962" y="584">C1–C4 100 nF. The RC is a</text>
  <text class="bd" x="962" y="598">window, not a floor: 47–100 nF</text>
  <text class="bd" x="962" y="612">passes, 10 nF and 220 nF fail.</text>
  <text class="bd" x="962" y="626">100 nF is shared with the power board.</text>

  <!-- AIRPLANE toggle path -->
  <path class="w" d="M218 170 H260"/>
  <rect class="conn" x="260" y="150" width="60" height="38" rx="4"/>
  <text class="ref" x="272" y="168">J4</text>
  <text class="bd" x="266" y="181">1×3</text>
  <path class="w" d="M320 170 H920"/>
  <text class="net" x="360" y="163">GPIO_AIRPLANE · dedicated input · R8 10 kΩ · R12 1 kΩ · C4 100 nF, same as a key</text>
  <text class="bd" x="360" y="197">Software radio block only — the indicator is driven from confirmed radio-off state, not from lever position.</text>

  <!-- key switches: GND on the left, GPIO to the right -->
  <!-- SW1 LINK -->
  <text class="ref" x="268" y="246">SW1 · LINK — C&amp;K KSC221JLFS (LCSC C221726) · travel 0.35 mm nom · plunger rests on a 0.3 mm air gap, never preloaded</text>
  <path class="sym" d="M272 262 V282 M264 282 H280 M267 287 H277 M270 292 H274"/>
  <path class="w" d="M272 262 H300"/>
  <path class="sym" d="M300 262 H316 M318 262 L344 250 M352 262 H372"/>
  <circle class="dot" cx="317" cy="262" r="2.6"/>
  <circle class="dot" cx="351" cy="262" r="2.6"/>
  <path class="w" d="M372 262 H920"/>
  <text class="net" x="392" y="256">GPIO_LINK · R5 10 kΩ to +3V3 · R9 1 kΩ series · C1 100 nF to GND (SIM-13)</text>

  <!-- SW2 MAC -->
  <text class="ref" x="268" y="320">SW2 · MAC — same switch, same plunger, ~1.0 mm deeper counterbore</text>
  <path class="sym" d="M272 336 V356 M264 356 H280 M267 361 H277 M270 366 H274"/>
  <path class="w" d="M272 336 H300"/>
  <path class="sym" d="M300 336 H316 M318 336 L344 324 M352 336 H372"/>
  <circle class="dot" cx="317" cy="336" r="2.6"/>
  <circle class="dot" cx="351" cy="336" r="2.6"/>
  <path class="w" d="M372 336 H920"/>
  <text class="net" x="392" y="330">GPIO_MAC</text>

  <!-- SW3 star -->
  <text class="ref" x="268" y="394">SW3 · ★ — same switch, flush. SW4 and SW5 are spare footprints; the faceplate is not cut for them.</text>
  <path class="sym" d="M272 410 V430 M264 430 H280 M267 435 H277 M270 440 H274"/>
  <path class="w" d="M272 410 H300"/>
  <path class="sym" d="M300 410 H316 M318 410 L344 398 M352 410 H372"/>
  <circle class="dot" cx="317" cy="410" r="2.6"/>
  <circle class="dot" cx="351" cy="410" r="2.6"/>
  <path class="w" d="M372 410 H920"/>
  <text class="net" x="392" y="404">GPIO_STAR</text>

  <!-- LED driver + LEDs -->
  <rect class="ic" x="264" y="470" width="200" height="112" rx="6"/>
  <text class="ref" x="276" y="488">U1 · TLC59116IPWR</text>
  <text class="bd" x="276" y="502">LCSC C131194 · 16-ch I²C sink</text>
  <text class="bd" x="276" y="515">addr 0x60 — JP1–JP4 to GND</text>
  <text class="bd" x="276" y="528">clear of 0x68 All Call, 0x6B</text>
  <text class="bd" x="276" y="541">R1 1.87 kΩ on REXT → 10 mA/ch</text>
  <text class="bd" x="276" y="554">0.345 W, Tj 88 °C at 60 °C amb.</text>
  <text class="warn" x="276" y="570">RESET out, R4 10 kΩ to +3V3</text>

  <rect class="led" x="556" y="470" width="204" height="112" rx="6"/>
  <text class="ref" x="568" y="488">D1–D4 · RGB indicators</text>
  <text class="bd" x="568" y="502">MEIHUA MHPA2525RGBDT-S</text>
  <text class="bd" x="568" y="515">LCSC C404285 · common anode</text>
  <text class="bd" x="568" y="528">frosted lens — diffuses itself,</text>
  <text class="bd" x="568" y="541">so optics no longer set standoff</text>
  <text class="bd" x="568" y="554">one per control, faceplate side</text>
  <text class="warn" x="568" y="570">opaque walls between openings</text>

  <path class="w" d="M464 510 H556"/>
  <text class="net" x="510" y="504" text-anchor="middle">12 × OUTn</text>
  <path class="w" d="M760 496 H920"/>
  <text class="net" x="772" y="490">+5 V anodes · C7 bulk</text>
  <path class="wd" d="M364 582 V600 H920"/>
  <text class="net" x="560" y="594" text-anchor="middle">SDA · SCL · +3V3 · GND · /RESET — R2/R3 2.2 kΩ pull-ups live here</text>

  <!-- ANO connector -->
  <path class="w" d="M218 373 H226 V640 H264"/>
  <rect class="conn" x="264" y="618" width="180" height="44" rx="4"/>
  <text class="ref" x="276" y="636">J3 · STEMMA QT 4-pin</text>
  <text class="bd" x="276" y="652">3V3 · GND · SDA · SCL</text>
  <path class="wd" d="M444 640 H920"/>
  <text class="net" x="460" y="634">ANO I²C 0x49 — shares SDA/SCL with U1 · its 10 kΩ ∥ 2.2 kΩ = 1.8 kΩ, t_r 229 ns</text>

  <!-- display connector -->
  <path class="w" d="M218 672 H264"/>
  <rect class="conn" x="264" y="664" width="190" height="34" rx="4"/>
  <text class="ref" x="276" y="680">J2 · JST GH 9-pin, side-entry</text>
  <text class="bd" x="276" y="693">SM09B-GHS-TB · C265420</text>
  <path class="wd" d="M454 684 H920"/>
  <text class="net" x="466" y="678">display SPI, fanned out from J1 — match Waveshare's pin order off the HAT</text>

  <!-- footer -->
  <line class="ch" x1="24" y1="724" x2="1176" y2="724"/>
  <text class="bd" x="24" y="744">Solid = power or digital-in wiring · dashed teal = I²C / SPI bus · dashed grey boxes = off-board parts that wire to this PCB but do not mount on it.</text>
  <text class="bd" x="24" y="760">Blue = IC · orange = optoelectronics · green = connectors. Every placed part now has an LCSC code (2026-11-18), so this board is a fully machine-assembled quote.</text>
  <text class="warn" x="24" y="778">Panel cutouts must come from the current manufacturer drawing, never from the nominal dimensions quoted in the docs. Passive values are from sim/retired/11–13 (2026-11-18), unmeasured on hardware.</text>
  </g>
</svg>
