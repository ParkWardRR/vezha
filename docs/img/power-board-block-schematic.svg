<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1314" width="1420" height="1314" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <style>
    .t    { font-size:22px; font-weight:700; fill:#0f172a; }
    .st   { font-size:12px; fill:#475569; }
    .hd   { font-size:12.5px; font-weight:700; fill:#0f172a; }
    .bd   { font-size:10.5px; fill:#475569; }
    .net  { font-size:10px; fill:#0f766e; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ref  { font-size:10.5px; font-weight:700; fill:#0f172a; }
    .warn { font-size:10.5px; fill:#b91c1c; }
    .board{ fill:#fbfdfe; stroke:#0f766e; stroke-width:1.6; stroke-dasharray:8 5; }
    .ob   { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.3; stroke-dasharray:5 4; }
    .pwr  { fill:#fee2e2; stroke:#dc2626; stroke-width:1.4; }
    .ctl  { fill:#dcfce7; stroke:#16a34a; stroke-width:1.4; }
    .conn { fill:#ecfdf5; stroke:#16a34a; stroke-width:1.4; }
    .sns  { fill:#dbeafe; stroke:#2563eb; stroke-width:1.4; }
    .note { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.2; }
    .pill { fill:#ccfbf1; stroke:#0f766e; stroke-width:1.1; }
    .w    { stroke:#b91c1c; stroke-width:2.4; fill:none; }
    .wc   { stroke:#334155; stroke-width:1.5; fill:none; }
    .wd   { stroke:#0f766e; stroke-width:1.4; fill:none; stroke-dasharray:6 4; }
    .sym  { stroke:#334155; stroke-width:1.5; fill:none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#b91c1c"/>
    </marker>
    <marker id="ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="at" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1420" height="1314" fill="#ffffff"/>

  <text class="t"  x="34" y="44">Vezha · Power board</text>
  <text class="st" x="34" y="70">Block overview of docs/06-power-board-schematic.md — same reference designators, net names and values.</text>
  <text class="st" x="34" y="88">That document is the authority; this is the one-page view of it. Nothing here is built or measured.</text>

  <!-- ===== board outline ===== -->
  <rect class="board" x="300" y="116" width="892" height="1042" rx="6"/>
  <text class="ref" x="316" y="138">Power board · board outline (dashed teal) — a carrier plus a sequencing controller; the modules do the PD and the regulation</text>

  <!-- ===== external ===== -->
  <rect class="ob" x="24" y="170" width="252" height="140" rx="5"/>
  <text class="hd" x="38" y="194">External USB-C PD</text>
  <text class="bd" x="38" y="216">charger or power bank, into the</text>
  <text class="bd" x="38" y="231">RotoPD's own jack at the wall</text>
  <text class="bd" x="38" y="252">bank vs. internal cell: open</text>

  <rect class="ob" x="1216" y="170" width="196" height="180" rx="5"/>
  <text class="hd" x="1230" y="194">Orange Pi 5 Plus</text>
  <text class="bd" x="1230" y="216">Enclosure A</text>
  <text class="bd" x="1230" y="231">dedicated USB-C power in</text>
  <text class="bd" x="1230" y="246">specified 5 V @ 4 A</text>
  <text class="warn" x="1230" y="270">must still see ≥ 4.75 V</text>
  <text class="warn" x="1230" y="285">here under load — the loop</text>
  <text class="warn" x="1230" y="300">binds before the 3 A limit</text>

  <!-- ===== ROW 1 · power spine ===== -->
  <rect class="pwr" x="316" y="170" width="236" height="170" rx="5"/>
  <text class="hd" x="330" y="192">U1 · CentyLab RotoPD Pro</text>
  <text class="bd" x="330" y="213">module · AP33772S + 100 V switch</text>
  <text class="bd" x="330" y="228">PD over its own USB-C jack</text>
  <text class="bd" x="330" y="243">aux buck 5 V, 0.4 A continuous</text>
  <text class="bd" x="330" y="258">own INA238 · I²C1 with the Pico</text>
  <text class="warn" x="330" y="282">240 W EPR/AVS — VBUS to 48 V</text>
  <text class="warn" x="330" y="297">addresses are community-sourced</text>

  <rect class="pwr" x="620" y="170" width="240" height="170" rx="5"/>
  <text class="hd" x="634" y="192">U3 · Pololu D42V55F5</text>
  <text class="bd" x="634" y="213">module · fixed 5.0 V ±3 %, 6 A typ</text>
  <text class="bd" x="634" y="228">VBUS_PD → +5V_RTR for the Pi</text>
  <text class="bd" x="634" y="243">EN in · PG open-drain, R2 10 kΩ</text>
  <text class="warn" x="634" y="267">PART NUMBER OPEN: the 4.85 V</text>
  <text class="warn" x="634" y="282">corner misses the seam's loop</text>
  <text class="warn" x="634" y="297">budget — F5.3 (#5572) at 5.3 V?</text>

  <rect class="conn" x="950" y="170" width="206" height="170" rx="5"/>
  <text class="hd" x="964" y="192">J2 · seam USB-C out</text>
  <text class="bd" x="964" y="213">5 V and GND only</text>
  <text class="bd" x="964" y="228">no signal, no detect pin</text>
  <text class="bd" x="964" y="243">Rp on CC1 and CC2</text>
  <text class="bd" x="964" y="258">VBUS only after a sink's Rd</text>
  <text class="warn" x="964" y="282">25 mΩ round-trip loop at 4 A</text>
  <text class="warn" x="964" y="297">is the real constraint</text>

  <!-- spine wiring -->
  <line class="w" x1="276" y1="250" x2="310" y2="250" marker-end="url(#ar)"/>
  <line class="w" x1="552" y1="250" x2="614" y2="250" marker-end="url(#ar)"/>
  <text class="net" x="583" y="236" text-anchor="middle">VBUS_PD</text>
  <text class="bd"  x="583" y="272" text-anchor="middle">4.5–48 V</text>

  <line class="w" x1="860" y1="250" x2="888" y2="250"/>
  <rect x="888" y="240" width="46" height="20" fill="#ffffff" stroke="#b91c1c" stroke-width="1.6"/>
  <text class="net" x="911" y="226" text-anchor="middle">R13 · 2 mΩ</text>
  <line class="w" x1="934" y1="250" x2="944" y2="250" marker-end="url(#ar)"/>
  <line class="w" x1="1156" y1="250" x2="1210" y2="250" marker-end="url(#ar)"/>
  <text class="net" x="1183" y="272" text-anchor="middle">+5V_RTR</text>

  <!-- ===== ROW 2 · sensing ===== -->
  <rect class="sns" x="620" y="400" width="240" height="124" rx="5"/>
  <text class="hd" x="634" y="422">RT1 · 10 kΩ NTC on U3's pad</text>
  <text class="bd" x="634" y="443">Murata NCP18XH103F03RB</text>
  <text class="bd" x="634" y="458">C13564 · R16 10 kΩ divider</text>
  <text class="bd" x="634" y="473">reads derating with the lid closed</text>
  <text class="bd" x="634" y="494">NTC_ADC → GP28</text>

  <rect class="sns" x="890" y="400" width="286" height="138" rx="5"/>
  <text class="hd" x="904" y="422">U6 · INA226AIDGSR</text>
  <text class="bd" x="904" y="443">LCSC C49851 · VSSOP-10</text>
  <text class="bd" x="904" y="458">high-side across R13 (C160590)</text>
  <text class="bd" x="904" y="473">1.25 mA steps · what the Pi gets</text>
  <text class="bd" x="904" y="488">I²C1 · strap clear of 0x40, 0x52</text>
  <text class="warn" x="904" y="512">basis for overcurrent shutdown</text>

  <line class="wc" x1="740" y1="400" x2="740" y2="346" marker-end="url(#ac)"/>
  <line class="wc" x1="912" y1="400" x2="912" y2="266" marker-end="url(#ac)"/>

  <!-- ===== ROW 3 · controller ===== -->
  <rect class="ctl" x="316" y="580" width="250" height="208" rx="5"/>
  <text class="hd" x="330" y="604">U2 · Raspberry Pi Pico 2</text>
  <text class="bd" x="330" y="625">RP2350, non-wireless</text>
  <text class="bd" x="330" y="640">VSYS from +5V_AUX through D1</text>
  <text class="bd" x="330" y="655">+3V3 out: ≤ 300 mA for the board</text>
  <text class="bd" x="330" y="670">GP2/3 I²C1 · GP4/5 I²C0</text>
  <text class="bd" x="330" y="685">GP6 EN · GP7 PG · GP26/27 CC ADC</text>
  <text class="bd" x="330" y="700">boots before the Orange Pi</text>
  <text class="warn" x="330" y="724">GP6 is push-pull, never an input</text>

  <!-- aux rail + D1 : U1 down to U2 -->
  <line class="w" x1="356" y1="340" x2="356" y2="398"/>
  <path class="sym" d="M347,398 L365,398 L356,414 Z" fill="#fee2e2"/>
  <line class="sym" x1="345" y1="414" x2="367" y2="414"/>
  <line class="w" x1="356" y1="414" x2="356" y2="574" marker-end="url(#ar)"/>
  <text class="bd" x="372" y="392">+5V_AUX ≤ 0.4 A</text>
  <text class="bd" x="372" y="432">D1 · SS14 blocks back-feed</text>
  <text class="bd" x="372" y="447">into VSYS · 4.58–4.75 V</text>

  <!-- I2C1 : U1 to U2 -->
  <line class="wd" x1="520" y1="340" x2="520" y2="574" marker-end="url(#at)"/>
  <text class="net" x="512" y="470" text-anchor="end">I²C1 · GP2/3</text>
  <text class="bd"  x="512" y="485" text-anchor="end">rail-critical</text>

  <!-- EN / PG riser : U2 to U3 -->
  <path class="wc" d="M566,648 L596,648 L596,360 L682,360 L682,346" marker-end="url(#ac)"/>
  <text class="net" x="588" y="556" text-anchor="end">EN ← GP6</text>
  <text class="net" x="588" y="571" text-anchor="end">PG → GP7</text>

  <!-- R1 pull-down off the EN riser -->
  <line class="wc" x1="596" y1="600" x2="644" y2="600"/>
  <rect x="636" y="600" width="18" height="40" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <line class="wc" x1="645" y1="640" x2="645" y2="656"/>
  <line class="sym" x1="631" y1="656" x2="659" y2="656"/>
  <line class="sym" x1="636" y1="662" x2="654" y2="662"/>
  <line class="sym" x1="641" y1="668" x2="649" y2="668"/>
  <text class="net"  x="668" y="612">R1 · 1.5 kΩ</text>
  <text class="warn" x="668" y="627">imposes OFF</text>

  <!-- ===== ROW 4 · controller peripherals ===== -->
  <rect class="conn" x="316" y="830" width="236" height="158" rx="5"/>
  <text class="hd" x="330" y="852">J3 · telemetry UART</text>
  <text class="warn" x="330" y="873">POPULATED, unwired in Rev A</text>
  <text class="bd" x="330" y="894">1×3 header · C2937625</text>
  <text class="bd" x="330" y="909">4-position, one blanked as a key</text>
  <text class="bd" x="330" y="924">R14/R15 220 Ω series</text>
  <text class="bd" x="330" y="939">silkscreen TX→RX</text>

  <rect class="conn" x="580" y="830" width="236" height="158" rx="5"/>
  <text class="hd" x="594" y="852">J4 · OLED console</text>
  <text class="bd" x="594" y="873">Adafruit 5297</text>
  <text class="bd" x="594" y="888">JST-SH QT 4-pin</text>
  <text class="bd" x="594" y="903">+3V3 · GND · SDA · SCL</text>
  <text class="bd" x="594" y="918">I²C0 — reporting only</text>
  <text class="bd" x="594" y="939">a wedged display cannot</text>
  <text class="bd" x="594" y="954">stall PD control</text>

  <rect class="conn" x="844" y="830" width="250" height="158" rx="5"/>
  <text class="hd" x="858" y="852">J5 · push encoder</text>
  <text class="bd" x="858" y="873">Alps EC11E15244B2, keyed</text>
  <text class="bd" x="858" y="888">R7–R9 10 kΩ · R10–R12 1 kΩ</text>
  <text class="bd" x="858" y="903">C1–C3 100 nF · A · B · SW</text>
  <text class="bd" x="858" y="918">RC on board and Gray decode</text>
  <text class="warn" x="858" y="942">100 nF exactly — see SIM-05</text>

  <line class="wc" x1="370" y1="788" x2="370" y2="824" marker-end="url(#ac)"/>
  <path class="wc" d="M478,788 L478,810 L660,810 L660,824" marker-end="url(#ac)"/>
  <path class="wc" d="M566,744 L950,744 L950,824" marker-end="url(#ac)"/>
  <text class="net" x="758" y="736" text-anchor="middle">GP12 · A · B · SW — the RC is a window, not a floor</text>
  <text class="net" x="500" y="782">I²C0 · GP4/5</text>

  <!-- ===== ROW 5 · accessory branch ===== -->
  <rect class="pill" x="316" y="1062" width="84" height="22" rx="11"/>
  <text class="net" x="358" y="1077" text-anchor="middle">VBUS_PD</text>
  <line class="w" x1="400" y1="1073" x2="424" y2="1073" marker-end="url(#ar)"/>

  <rect class="pwr" x="430" y="1020" width="236" height="110" rx="5"/>
  <text class="hd" x="444" y="1042">U4 · TI LMR38020FDDAR</text>
  <text class="bd" x="444" y="1063">LCSC C5149193</text>
  <text class="warn" x="444" y="1084">4.2–80 V in, because VBUS</text>
  <text class="warn" x="444" y="1099">reaches 48 V</text>
  <text class="bd" x="444" y="1120">→ +5V_ACC · EN from GP10</text>

  <rect class="pwr" x="700" y="1020" width="236" height="110" rx="5"/>
  <text class="hd" x="714" y="1042">U5 · TI TPS2553DBVR</text>
  <text class="bd" x="714" y="1063">LCSC C55266 · SOT-23-6</text>
  <text class="bd" x="714" y="1078">R5 22.6 kΩ sets the limit</text>
  <text class="bd" x="714" y="1093">to 1.06–1.23 A</text>
  <text class="bd" x="714" y="1114">EN GP8 · FAULT GP9</text>

  <rect class="conn" x="970" y="1020" width="206" height="110" rx="5"/>
  <text class="hd" x="984" y="1042">J6 · accessory USB-C out</text>
  <text class="bd" x="984" y="1063">HRO TYPE-C-31-M-12 · C165948</text>
  <text class="bd" x="984" y="1078">side-facing, 5 V power only</text>
  <text class="bd" x="984" y="1093">R3/R4 36 kΩ Rp to +3V3</text>
  <text class="bd" x="984" y="1114">CC1/CC2 sensed on GP26/27</text>

  <line class="w" x1="666" y1="1073" x2="694" y2="1073" marker-end="url(#ar)"/>
  <line class="w" x1="936" y1="1073" x2="964" y2="1073" marker-end="url(#ar)"/>

  <!-- ===== legend + note ===== -->
  <rect class="note" x="24" y="1184" width="1388" height="108" rx="5"/>
  <rect class="pill" x="40" y="1200" width="62" height="20" rx="10"/>
  <text class="net" x="71" y="1214" text-anchor="middle">NET</text>
  <text class="bd" x="114" y="1214">Teal pills are <tspan font-weight="700">net labels — they connect by name, not by a drawn wire.</tspan> VBUS_PD at U1's output and VBUS_PD at U4's input are the same net; the accessory branch taps the PD rail, it is not a second supply.</text>
  <text class="bd" x="40" y="1240">Red = power path · dark grey = control and sensing · dashed teal = I²C. Only the nets that constrain layout are drawn; the schematic document carries every pin.</text>
  <text class="bd" x="40" y="1258">Also on the board, not drawn here: J1 RotoPD I²C (JST-SH, or U1's 1×8 header — not both) · J7 SWD 1×3 and a RUN reset pad · JP1 0 Ω to U1 pin 6, DNP in Rev A ·</text>
  <text class="bd" x="40" y="1273">test points on VBUS_PD, +5V_RTR, +3V3 and GND, plus a pair at the seam · 0 Ω jumpers on EN and each I²C bus · fiducials.</text>
</svg>
